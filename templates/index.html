<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Repository Map</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/index.css') }}">

</head>
<body>
    <div class="container">
        <h1>🗺️ GitHub Repo Map</h1>
        <p>Enter a GitHub username to visualize their repositories</p>
        
        <form id="githubForm" method="post" action="/map">
            <input 
                type="text" 
                name="username" 
                id="username" 
                placeholder="Enter GitHub username" 
                required
                autocomplete="off"
            >
            <button type="submit">Generate Map</button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p class="loading-text">Fetching repositories...</p>
        </div>
    </div>

    <script>
        document.getElementById('githubForm').addEventListener('submit', function() {
            document.getElementById('loading').style.display = 'block';
            document.querySelector('button').disabled = true;
        });
    </script>
</body>
</html>
